function getTodayDateString() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );

    const day =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );

    return `${year}-${month}-${day}`;

}

function getHistoryPath(
    dateStr
) {

    return `./${dateStr}/${HISTORY_FILE_NAME}`;

}


/* ============================================================
   LISTA DE FECHAS RECIENTES
============================================================ */

function getRecentDatesList(
    days = 15
) {

    const dates = [];

    const today =
        new Date();


    for (
        let i = 0;
        i < days;
        i++
    ) {

        const d =
            new Date(
                today
            );


        d.setDate(
            d.getDate() - i
        );


        const year =
            d.getFullYear();


        const month =
            String(
                d.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const day =
            String(
                d.getDate()
            ).padStart(
                2,
                "0"
            );


        dates.push(
            `${year}-${month}-${day}`
        );

    }


    return dates;

}


/* ============================================================
   CARGAR JSON DE UNA FECHA
============================================================ */

async function fetchHistoryForDate(
    dateStr,
    forceReload = false
) {

    if (
        !dateStr
    ) {

        return [];

    }


    /* ========================================================
       CACHÉ
    ======================================================== */

    if (

        !forceReload &&

        Object.prototype.hasOwnProperty.call(
            historyCache,
            dateStr
        )

    ) {

        console.log(
            "📦 Historial desde caché:",
            dateStr
        );


        return historyCache[
            dateStr
        ];

    }


    /* ========================================================
       RUTA
    ======================================================== */

    const path =
        getHistoryPath(
            dateStr
        );


    console.log(
        "📂 Buscando:",
        path
    );


    try {


        /* ====================================================
           FETCH

           Date.now evita caché
        ==================================================== */

        const response =
            await fetch(
                path +
                "?t=" +
                Date.now()
            );


        console.log(
            "📡 HTTP:",
            response.status
        );


        if (
            !response.ok
        ) {

            throw new Error(

                `HTTP ${response.status}`

            );

        }


        /* ====================================================
           JSON
        ==================================================== */

        const data =
            await response.json();


        /* ====================================================
           NORMALIZAR
        ==================================================== */

        let items = [];


        if (
            Array.isArray(
                data
            )
        ) {

            items =
                data;

        }

        else if (
            data &&
            Array.isArray(
                data.picks
            )
        ) {

            items =
                data.picks;

        }

        else if (
            data &&
            Array.isArray(
                data.data
            )
        ) {

            items =
                data.data;

        }

        else if (
            data &&
            Array.isArray(
                data.records
            )
        ) {

            items =
                data.records;

        }

        else if (
            data &&
            typeof data === "object"
        ) {

            items =
                [data];

        }


        /* ====================================================
           AÑADIR FECHA
        ==================================================== */

        const normalized =
            items.map(
                item => ({

                    ...item,

                    date:
                        item.date ||
                        dateStr

                })
            );


        /* ====================================================
           CACHÉ
        ==================================================== */

        historyCache[
            dateStr
        ] =
            normalized;


        console.log(

            `✅ ${normalized.length} registros cargados para ${dateStr}`

        );


        return normalized;

    }

    catch (
        error
    ) {


        console.error(

            `❌ Error cargando ${path}:`,

            error

        );


        /*
         * IMPORTANTE:
         *
         * No guardamos [] en caché
         * cuando hay error.
         *
         * Así se puede volver
         * a intentar cargar.
         */


        return [];

    }

}

async function loadSelectedHistoryDate() {

    const datePicker =
        document.getElementById(
            "historyDatePicker"
        );


    const loadButton =
        document.getElementById(
            "historyLoadButton"
        );


    const tbody =
        document.getElementById(
            "historyBody"
        );


    if (
        !datePicker
    ) {

        console.error(

            "❌ No existe historyDatePicker"

        );


        return;

    }


    const dateStr =
        datePicker.value;


    console.log(
        "🖱️ BOTÓN CARGAR FECHA PRESIONADO"
    );


    console.log(
        "📅 Fecha:",
        dateStr
    );


    if (
        !dateStr
    ) {

        updateHistoryStatus(

            "❌ Selecciona una fecha.",

            "error"

        );


        return;

    }


    /* ========================================================
       BOTÓN
    ======================================================== */

    if (
        loadButton
    ) {

        loadButton.disabled =
            true;

        loadButton.textContent =
            "⏳ Cargando...";

    }


    /* ========================================================
       ESTADO
    ======================================================== */

    updateHistoryStatus(

        `⏳ Cargando datos históricos de <strong>${dateStr}</strong>...`,

        "info"

    );


    if (
        tbody
    ) {

        tbody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="history-loading"
                >

                    ⏳ Cargando
                    ${dateStr}...

                </td>

            </tr>

        `;

    }


    try {


        /* ====================================================
           FETCH
        ==================================================== */

        const history =
            await fetchHistoryForDate(
                dateStr,
                true
            );


        /* ====================================================
           SIN REGISTROS
        ==================================================== */

        if (
            history.length === 0
        ) {


            updateHistoryStatus(

                `⚠️ No se encontraron registros para <strong>${dateStr}</strong>.`,

                "error"

            );


            if (
                tbody
            ) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            style="
                                text-align:center;
                                padding:40px;
                                color:var(--muted);
                            "
                        >

                            📭 No hay registros
                            para esta fecha.

                            <br><br>

                            <code>
                                ./${dateStr}/sharpie.json
                            </code>

                        </td>

                    </tr>

                `;

            }


            return;

        }


        /* ====================================================
           GUARDAR EN EL ESTADO
        ==================================================== */

        state.historyData =
            history;


        /* ====================================================
           FILTRAR
        ==================================================== */

        const filteredHistory =
            applyFiltersAndSort(
                history
            );


        /* ====================================================
           MOSTRAR
        ==================================================== */

        if (
            filteredHistory.length === 0
        ) {


            updateHistoryStatus(

                `⚠️ Se cargaron ${history.length} registros para <strong>${dateStr}</strong>, pero ninguno coincide con los filtros actuales.`,

                "info"

            );


            if (
                tbody
            ) {

                tbody.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            style="
                                text-align:center;
                                padding:40px;
                                color:var(--muted);
                            "
                        >

                            🔎 Ningún registro
                            coincide con los filtros.

                        </td>

                    </tr>

                `;

            }

        }

        else {


            updateHistoryStatus(

                `✅ ${filteredHistory.length} registros cargados para <strong>${dateStr}</strong>`,

                "success"

            );


            drawHistory(
                filteredHistory
            );

        }

    }

    catch (
        error
    ) {


        console.error(
            "❌ Error:",
            error
        );


        updateHistoryStatus(

            `❌ Error al cargar <strong>${dateStr}</strong>.`,

            "error"

        );

    }

    finally {


        if (
            loadButton
        ) {

            loadButton.disabled =
                false;

            loadButton.textContent =
                "📅 Cargar Fecha";

        }

    }

}

function updateHistoryStatus(
    message,
    type = "info"
) {

    const status =
        document.getElementById(
            "historyStatus"
        );


    if (
        !status
    ) {

        return;

    }


    status.innerHTML =
        message;


    if (
        type === "success"
    ) {

        status.style.borderLeftColor =
            "var(--teal)";

    }

    }

}

            );

    if (
        marketChartInstance
    ) {

        let sharpCount =
            0;

        let mixedCount =
            0;

        let publicCount =
            0;


        activeList.forEach(

            p => {

                if (
                    p.trendKey === "sharp" ||
                    p.whale
                ) {

                    sharpCount++;

                }

                else if (
                    p.trendKey === "mixed" ||
                    p.trendKey === "consensus"
                ) {

                    mixedCount++;

                }

                else {

                    publicCount++;

                }

            }

        );

            .data
            .datasets[0]
            .data = [

                sharpCount,

                mixedCount,

                publicCount

            ];


        marketChartInstance.update();

    }

/* ============================================================
   FUNCIONES EXISTENTES DEL DASHBOARD
============================================================ */

function scoreBadgeClass(
    score
) {

    const s =
        Number(
            score || 0
        );


    if (
        s >= 80
    ) {

        return "good";

    }


    if (
        s >= 55
    ) {

        return "warn";

    }


    return "bad";

}


function evBadgeClass(
    ev,
    isEstimated
) {

    const v =
        Number(
            ev || 0
        );


    if (
        isEstimated
    ) {

        return "neutral";

    }


    if (
        v >= 10
    ) {

        return "good";

    }


    if (
        v > 0
    ) {

        return "warn";

    }


    return "neutral";

}


function stakeBadgeClass(
    stake
) {

    const s =
        Number(
            stake || 0
        );


    if (
        s <= 0
    ) {

        return "neutral";

    }


    if (
        s >= 4
    ) {

        return "good";

    }


    if (
        s >= 2
    ) {

        return "warn";

    }


    return "neutral";

}


function riskBadgeClass(
    risk
) {

    const r =
        (
            risk ||
            ""
        ).toUpperCase();


    if (
        r === "LOW"
    ) {

        return "good";

    }


    if (
        r === "MEDIUM"
    ) {

        return "warn";

    }


    if (
        r === "HIGH"
    ) {

        return "bad";

    }


    return "neutral";

}


function trendTag(
    key
) {

    return `${

        TREND_ICON[
            key
        ] || "⚙️"

    } ${

        TREND_LABEL[
            key
        ] || "Normal"

    }`;

}


function isEventPending(
    p
) {

    const status =
        (
            p.status ||
            ""
        ).toUpperCase();


    if (

        status === "LIVE" ||

        status === "FINISHED" ||

        status === "WON" ||

        status === "LOST"

    ) {

        return false;

    }


    return (

        status === "UPCOMING" ||

        status === "PENDING" ||

        !status

    );

}


function calculateEdge(
    p
) {

    return (

        p.edge !== undefined

            ?

        Number(
            p.edge
        )

            :

        0

    );

}


function calculateSmartMoney(
    p
) {

    return (

        p.handlePct != null &&

        p.betsPct != null

    )

        ?

        (
            p.handlePct -
            p.betsPct
        )

        :

        0;

}


function parseOddsToDecimal(
    odds
) {

    if (
        odds == null ||
        odds === ""
    ) {

        return 0;

    }


    let str =
        String(
            odds
        ).trim();


    let val =
        parseFloat(
            str
        );


    if (
        isNaN(
            val
        )
    ) {

        return 0;

    }


    if (

        str.startsWith("+") ||

        str.startsWith("-") ||

        val > 20 ||

        val < -20

    ) {

        if (
            val > 0
        ) {

            return (
                val / 100
            ) + 1;

        }

        else if (
            val < 0
        ) {

            return (

                100 /
                Math.abs(
                    val
                )

            ) + 1;

        }

    }


    return val;

}


function isPremium(
    p
) {

    return (

        p.actionKey === "bet" &&

        calculateEdge(
            p
        ) >= 5 &&

        (
            p.score || 0
        ) >= 75

    );

}


function getVisualConfig(
    p
) {

    const score =
        p.score || 0;


    const key =
        p.trendKey;


    const edge =
        calculateEdge(
            p
        );


    const ev =
        Number(
            p.ev || 0
        );


    if (

        p.actionKey === "pass" &&

        edge < 5

    ) {

        return {

            key:
                "sin_ventaja",

            bg:
                "var(--red-soft)",

            border:
                "var(--border)",

            text:
                "var(--muted)",

            label:
                "⚪ SIN VENTAJA"

        };

    }


    if (

        key === "mixed" ||

        key === "public" ||

        key === "consensus"

    ) {


        if (

            edge >= 8 ||

            ev >= 5 ||

            score >= 70

        ) {

            return {

                key:
                    "mixed",

                bg:
                    "var(--amber-soft)",

                border:
                    "var(--amber)",

                text:
                    "var(--amber)",

                label:

                    `🟨 ${

                        key === "mixed"

                            ?

                        "MIXTO"

                            :

                        key === "public"

                            ?

                        "PUBLIC"

                            :

                        "CONSENSO"

                    }`

            };

        }


        return {

            key:
                "sin_ventaja",

            bg:
                "var(--red-soft)",

            border:
                "var(--red)",

            text:
                "var(--red)",

            label:
                "⚠️ SIN EDGE / FILTRADO"

        };

    }


    if (

        key === "sharp" ||

        score >= 80

    ) {

        return {

            key:
                "premium",

            bg:
                "var(--teal-soft)",

            border:
                "var(--teal)",

            text:
                "var(--teal)",

            label:
                "🟢 PREMIUM"

        };

    }


    return {

        key:
            "atento",

        bg:
            "var(--panel2)",

        border:
            "var(--border)",

        text:
            "var(--text)",

        label:
            "⚡ ATENTO"

    };

}


/* ============================================================
   FILTROS
============================================================ */

function applyFiltersAndSort(
    list
) {

    if (
        !Array.isArray(
            list
        )
    ) {

        return [];

    }


    const text =
        state.search
            .toLowerCase()
            .trim();


    let result =
        list.filter(

            p => {


                if (

                    state.league &&

                    p.league !==
                    state.league

                ) {

                    return false;

                }


                if (

                    state.date &&

                    p.date !==
                    state.date

                ) {

                    return false;

                }


                if (

                    state.trend &&

                    p.trendKey !==
                    state.trend

                ) {

                    return false;

                }


                if (
                    state.classification
                ) {

                    const config =
                        getVisualConfig(
                            p
                        );


                    if (

                        config.key !==
                        state.classification

                    ) {

                        return false;

                    }

                }


                if (
                    state.risk
                ) {

                    const pRisk =
                        (
                            p.risk ||
                            ""
                        ).toUpperCase();


                    if (

                        pRisk !==
                        state.risk

                    ) {

                        return false;

                    }

                }


                if (

                    state.modeloMin !== null &&

                    (
                        p.modelProb ||
                        0
                    ) <
                    state.modeloMin

                ) {

                    return false;

                }


                if (

                    state.modeloMax !== null &&

                    (
                        p.modelProb ||
                        0
                    ) >
                    state.modeloMax

                ) {

                    return false;

                }


                const itemOddsDec =
                    parseOddsToDecimal(

                        p.odds ||
                        p.cuota

                    );


                if (
                    state.cuotaMin !== null
                ) {

                    const minDec =
                        parseOddsToDecimal(
                            state.cuotaMin
                        );


                    if (

                        minDec > 0 &&

                        itemOddsDec <
                        minDec

                    ) {

                        return false;

                    }

                }


                if (
                    state.cuotaMax !== null
                ) {

                    const maxDec =
                        parseOddsToDecimal(
                            state.cuotaMax
                        );


                    if (

                        maxDec > 0 &&

                        itemOddsDec >
                        maxDec

                    ) {

                        return false;

                    }

                }


                const edgeVal =
                    calculateEdge(
                        p
                    );


                if (

                    state.edgeMin !== null &&

                    edgeVal <
                    state.edgeMin

                ) {

                    return false;

                }


                if (

                    state.edgeMax !== null &&

                    edgeVal >
                    state.edgeMax

                ) {

                    return false;

                }


                if (

                    state.scoreMin !== null &&

                    (
                        p.score ||
                        0
                    ) <
                    state.scoreMin

                ) {

                    return false;

                }


                if (

                    state.scoreMax !== null &&

                    (
                        p.score ||
                        0
                    ) >
                    state.scoreMax

                ) {

                    return false;

                }


                const evVal =
                    Number(
                        p.ev ||
                        0
                    );


                if (

                    state.evMin !== null &&

                    evVal <
                    state.evMin

                ) {

                    return false;

                }


                if (

                    state.evMax !== null &&

                    evVal >
                    state.evMax

                ) {

                    return false;

                }


                const stakeVal =
                    Number(
                        p.stake ||
                        0
                    );


                if (

                    state.stakeMin !== null &&

                    stakeVal <
                    state.stakeMin

                ) {

                    return false;

                }


                if (

                    state.stakeMax !== null &&

                    stakeVal >
                    state.stakeMax

                ) {

                    return false;

                }


                if (

                    state.whaleOnly &&

                    !p.whale &&

                    p.trendKey !==
                    "sharp" &&

                    calculateSmartMoney(
                        p
                    ) < 15

                ) {

                    return false;

                }


                if (

                    state.freePickOnly &&

                    !p.freePick

                ) {

                    return false;

                }


                if (
                    text
                ) {

                    const blob = `

                        ${p.game || ""}

                        ${p.pick || ""}

                        ${p.market || ""}

                        ${p.reason || ""}

                    `.toLowerCase();


                    if (

                        !blob.includes(
                            text
                        )

                    ) {

                        return false;

                    }

                }


                return true;

            }

        );


    return result.sort(

        (a, b) => {


            if (
                state.sort === "time"
            ) {

                return (

                    new Date(
                        a.iso || 0
                    ) -

                    new Date(
                        b.iso || 0
                    )

                );

            }


            if (
                state.sort === "score"
            ) {

                return (

                    (
                        b.score ||
                        0
                    ) -

                    (
                        a.score ||
                        0
                    )

                );

            }


            if (
                state.sort === "edge"
            ) {

                return (

                    calculateEdge(
                        b
                    ) -

                    calculateEdge(
                        a
                    )

                );

            }


            if (
                state.sort ===
                "recommended"
            ) {

                const scoreA =

                    (
                        isPremium(
                            a
                        )
                            ?

                        1000

                            :

                        0

                    ) +

                    (
                        a.score ||
                        0
                    );


                const scoreB =

                    (
                        isPremium(
                            b
                        )
                            ?

                        1000

                            :

                        0

                    ) +

                    (
                        b.score ||
                        0
                    );


                return (
                    scoreB -
                    scoreA
                );

            }


            return 0;

        }

    );

}

/* ============================================================
   RENDER
============================================================ */

async function render() {

    const emptyState =
        document.getElementById(
            "emptyState"
        );


    const emptyMsg =
        document.getElementById(
            "emptyStateMsg"
        );


    const cardsView =
        document.getElementById(
            "cardsView"
        );


    const historyView =
        document.getElementById(
            "historyView"
        );


    /* ========================================================
       CARDS
    ======================================================== */

    if (
        state.view === "cards"
    ) {

        historyView.style.display =
            "none";


        if (

            !Array.isArray(
                PICKS
            ) ||

            PICKS.length === 0

        ) {

            emptyState.style.display =
                "block";


            emptyMsg.innerText =

                "No se encontraron registros activos operables bajo estos parámetros.";


            cardsView.style.display =
                "none";


            return;

        }


        const filteredPicks =
            applyFiltersAndSort(
                PICKS
            );


        const activePicks =
            filteredPicks.filter(
                isEventPending
            );


        updateChartsData(
            activePicks
        );


        if (
            activePicks.length === 0
        ) {

            emptyState.style.display =
                "block";


            emptyMsg.innerText =

                "No se encontraron eventos activos que coincidan con los filtros.";


            cardsView.style.display =
                "none";

        }

        else {

            emptyState.style.display =
                "none";


            cardsView.style.display =
                "grid";


            drawCards(
                activePicks
            );

        }


        return;

    }


    /* ========================================================
       HISTORIAL

       IMPORTANTE:

       Aquí NO hacemos fetch.

       El fetch solo se ejecuta
       al presionar Cargar Fecha.
    ======================================================== */

    if (
        state.view === "history"
    ) {

        cardsView.style.display =
            "none";


        historyView.style.display =
            "block";


        emptyState.style.display =
            "none";


        return;

    }

}

                state.risk =

    /* ========================================================
       INPUTS NUMÉRICOS
    ======================================================== */

    const bindNumInput = (

        id,

        stateKey

    ) => {


        const el =
            document.getElementById(
                id
            );


        if (
            el
        ) {

            el.addEventListener(

                "input",

                e => {


                    const val =
                        parseFloat(
                            e.target.value
                        );


                    state[
                        stateKey
                    ] =

                        isNaN(
                            val
                        )

                            ?

                        null

                            :

                        val;


                    render();

                }

            );

        }

    };


    bindNumInput(
        "fModeloMin",
        "modeloMin"
    );


    bindNumInput(
        "fModeloMax",
        "modeloMax"
    );


    bindNumInput(
        "fEdgeMin",
        "edgeMin"
    );


    bindNumInput(
        "fEdgeMax",
        "edgeMax"
    );


    bindNumInput(
        "fScoreMin",
        "scoreMin"
    );


    bindNumInput(
        "fScoreMax",
        "scoreMax"
    );


    bindNumInput(
        "fEvMin",
        "evMin"
    );


    bindNumInput(
        "fEvMax",
        "evMax"
    );


    bindNumInput(
        "fStakeMin",
        "stakeMin"
    );


    bindNumInput(
        "fStakeMax",
        "stakeMax"
    );


    /* ========================================================
       CUOTAS
    ======================================================== */

    const bindOddsInput = (

        id,

        stateKey

    ) => {


        const el =
            document.getElementById(
                id
            );


        if (
            el
        ) {

            el.addEventListener(

                "input",

                e => {


                    const val =
                        e.target.value.trim();


                    state[
                        stateKey
                    ] =

                        val === ""

                            ?

                        null

                            :

                        val;


                    render();

                }

            );

        }

    };


    bindOddsInput(
        "fCuotaMin",
        "cuotaMin"
    );


    bindOddsInput(
        "fCuotaMax",
        "cuotaMax"
    );


    /* ========================================================
       ORDENAR
    ======================================================== */

    const sortEl =
        document.getElementById(
            "fSort"
        );


    if (
        sortEl
    ) {

        sortEl.addEventListener(

            "change",

            e => {

                state.sort =
                    e.target.value;


                render();

            }

        );

    }


    /* ========================================================
       BUSCAR
    ======================================================== */

    const searchEl =
        document.getElementById(
            "search"
        );


    if (
        searchEl
    ) {

        searchEl.addEventListener(

            "input",

            e => {

                state.search =
                    e.target.value;


                render();

            }

        );

    }


    /* ========================================================
       WHALE
    ======================================================== */

    const whaleBtn =
        document.getElementById(
            "whaleOnly"
        );


    if (
        whaleBtn
    ) {

        whaleBtn.addEventListener(

            "click",

            () => {


                state.whaleOnly =
                    !state.whaleOnly;


                whaleBtn.setAttribute(

                    "aria-pressed",

                    state.whaleOnly

                );


                render();

            }

        );

    }


    /* ========================================================
       FREE PICKS
    ======================================================== */

    const freePickBtn =
        document.getElementById(
            "freePickOnly"
        );


    if (
        freePickBtn
    ) {

        freePickBtn.addEventListener(

            "click",

            () => {


                state.freePickOnly =
                    !state.freePickOnly;


                freePickBtn.setAttribute(

                    "aria-pressed",

                    state.freePickOnly

                );


                render();

            }

        );

    }


    /* ========================================================
       VISTAS
    ======================================================== */

    const vCards =
        document.getElementById(
            "viewCards"
        );


    const vHist =
        document.getElementById(
            "viewHistory"
        );


    if (
        vCards
    ) {

        vCards.onclick = () => {


            state.view =
                "cards";


            toggleTabs(
                "viewCards"
            );


            render();

        };

    }


    if (
        vHist
    ) {

        vHist.onclick = () => {


            state.view =
                "history";


            toggleTabs(
                "viewHistory"
            );


            render();

        };

    }


    function toggleTabs(
        activeId
    ) {

        [

            "viewCards",

            "viewHistory"

        ].forEach(

            id => {


                const el =
                    document.getElementById(
                        id
                    );


                if (
                    el
                ) {

                    el.setAttribute(

                        "aria-pressed",

                        id === activeId

                    );

                }

            }

        );

    }


    /* ========================================================
       LIMPIAR FILTROS
    ======================================================== */

    const clearBtn =
        document.getElementById(
            "clearBtn"
        );


    if (
        clearBtn
    ) {

        clearBtn.addEventListener(

            "click",

            () => {


                state.search =
                    "";

                state.date =
                    "";

                state.league =
                    "";

                state.trend =
                    "";

                state.classification =
                    "";

                state.risk =
                    "";

                state.whaleOnly =
                    false;

                state.freePickOnly =
                    false;

                state.sort =
                    "time";


                if (
                    searchEl
                ) {

                    searchEl.value =
                        "";

                }


                if (
                    sortEl
                ) {

                    sortEl.value =
                        "time";

                }


                [

                    "fDate",

                    "fLeague",

                    "fTrend",

                    "fClassification",

                    "fRisk"

                ].forEach(

                    id => {


                        const el =
                            document.getElementById(
                                id
                            );


                        if (
                            el
                        ) {

                            el.value =
                                "";

                        }

                    }

                );


                if (
                    whaleBtn
                ) {

                    whaleBtn.setAttribute(

                        "aria-pressed",

                        false

                    );

                }


                if (
                    freePickBtn
                ) {

                    freePickBtn.setAttribute(

                        "aria-pressed",

                        false

                    );

                }


                render();

            }

        );

    }

}


/* ============================================================
   TEMA
============================================================ */

const themeToggle =
    document.getElementById(
        "themeToggle"
    );


if (
    themeToggle
) {

    themeToggle.addEventListener(

        "click",

        () => {


            state.autoThemeEnabled =
                false;


            const doc =
                document.documentElement;


            const currentTheme =
                doc.getAttribute(
                    "data-theme"
                );


            doc.setAttribute(

                "data-theme",

                currentTheme === "dark"

                    ?

                "light"

                    :

                "dark"

            );


            initCharts();


            render();

        }

    );

}


/* ============================================================
   TEMA AUTOMÁTICO
============================================================ */

function updateThemeByTime() {

    if (
        !state.autoThemeEnabled
    ) {

        return;

    }


    const hour =
        new Date().getHours();


    const doc =
        document.documentElement;


    if (

        hour >= 6 &&

        hour < 19

    ) {

        doc.setAttribute(

            "data-theme",

            "light"

        );

    }

    else {

        doc.setAttribute(

            "data-theme",

            "dark"

        );

    }

}


/* ============================================================
   MOTOR
============================================================ */

function initEngine() {


    const clock =
        document.getElementById(
            "clock"
        );


    updateThemeByTime();


    initCharts();


    setInterval(

        () => {


            if (
                clock
            ) {

                clock.innerText =

                    new Date()

                        .toTimeString()

                        .split(
                            " "
                        )[0];

            }


            updateThemeByTime();


        },

        1000

    );

}


/* ============================================================
   INICIALIZACIÓN

   ÚNICO DOMContentLoaded
============================================================ */

document.addEventListener(

    "DOMContentLoaded",

    () => {


        console.log(

            "✅ Sharpie Dashboard iniciado"

        );


        /* ====================================================
           CONFIGURAR FILTROS
        ==================================================== */

        setupFilters();


        /* ====================================================
           MOTOR
        ==================================================== */

        initEngine();


        /* ====================================================
           RENDER INICIAL
        ==================================================== */

        render();


    }

);

</script>
