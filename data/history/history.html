<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharpie Data Viewer - Mega Sábana</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b0f14;
            --panel: #111820;
            --panel2: #151e28;
            --border: #26313d;
            --text: #e8edf2;
            --muted: #8e9aa7;
            --accent: #4da3ff;
            --green: #35c98a;
            --red: #ef6262;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            min-height: 70px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0e141b;
            border-bottom: 1px solid var(--border);
        }

        header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

        .container {
            width: min(1600px, calc(100% - 40px));
            margin: 20px auto;
        }

        .filters {
            display: flex;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .filter {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter.grow {
            flex-grow: 1;
            min-width: 200px;
        }

        .filter label {
            color: var(--muted);
            font-size: 12px;
        }

        select, input {
            padding: 9px 12px;
            background: #0d1319;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }

        select { cursor: pointer; min-width: 110px; }
        input:focus { border-color: var(--accent); }

        button {
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover { background: #1b2632; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

        #status {
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 13px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-header h2 { margin: 0; font-size: 16px; }
        .section-header span { color: var(--muted); font-size: 13px; }

        .table-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 70vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            background: #0e141b;
            position: sticky;
            top: 0;
            z-index: 2;
            font-weight: 600;
        }

        tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .val-positive { color: var(--green); }
        .val-negative { color: var(--red); }
        .empty { padding: 40px; text-align: center; color: var(--muted); }
        .error { color: var(--red) !important; }

        @media (max-width: 700px) {
            header { padding: 15px; flex-direction: column; align-items: flex-start; gap: 10px; }
            .container { width: calc(100% - 20px); }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>SHARPIE DATA VIEWER (MEGA SÁBANA)</h1>
        <p id="fileInfo">Inicializando base de datos global...</p>
    </div>
    <button id="refreshBtn">↻ Recargar Todo</button>
</header>

<main class="container">

    <section class="filters">
        <div class="filter">
            <label>Año Archivo</label>
            <select id="yearSelect">
                <option value="ALL">Todos</option>
            </select>
        </div>

        <div class="filter">
            <label>Mes Archivo</label>
            <select id="monthSelect">
                <option value="ALL">Todos</option>
            </select>
        </div>

        <div class="filter">
            <label>Día Archivo</label>
            <select id="daySelect">
                <option value="ALL">Todos</option>
            </select>
        </div>

        <div class="filter">
            <label>Fecha del Pick</label>
            <input type="date" id="pickDateFilter">
        </div>

        <div class="filter">
            <label>Hora del Pick</label>
            <input type="time" id="pickTimeFilter">
        </div>

        <div class="filter grow">
            <label>Buscar Encuentro / Equipo / Mercado</label>
            <input type="text" id="searchInput" placeholder="Ej. Lakers, Real Madrid, Over...">
        </div>
    </section>

    <div id="status">Detectando archivos...</div>

    <section>
        <div class="section-header">
            <h2>Registros Filtrados</h2>
            <span id="pickCounter">0 picks</span>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Origen</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Evento</th>
                            <th>Pick</th>
                            <th>Cuota</th>
                            <th>Stake</th>
                            <th>Edge</th>
                            <th>EV</th>
                            <th>Win Prob</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="10" class="empty">Cargando mega sábana de información...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<script>
"use strict";

const HISTORY_PATH = "./";

/* DOM ELEMENTS */
const yearSelect = document.getElementById("yearSelect");
const monthSelect = document.getElementById("monthSelect");
const daySelect = document.getElementById("daySelect");
const refreshBtn = document.getElementById("refreshBtn");
const searchInput = document.getElementById("searchInput");
const pickDateFilter = document.getElementById("pickDateFilter");
const pickTimeFilter = document.getElementById("pickTimeFilter");
const status = document.getElementById("status");
const fileInfo = document.getElementById("fileInfo");
const tableBody = document.getElementById("tableBody");
const pickCounter = document.getElementById("pickCounter");

let availableDates = [];
let masterPicksList = [];

document.addEventListener("DOMContentLoaded", async () => {
    await initMegaSabana();
});

/* INICIALIZACIÓN GLOBAL */
async function initMegaSabana() {
    await detectAvailableDates();
    initializeSelectors();
    await loadAllHistories();
    
    yearSelect.addEventListener("change", () => { updateMonths(); filterAndRenderPicks(); });
    monthSelect.addEventListener("change", () => { updateDays(); filterAndRenderPicks(); });
    daySelect.addEventListener("change", filterAndRenderPicks);
    searchInput.addEventListener("input", filterAndRenderPicks);
    pickDateFilter.addEventListener("change", filterAndRenderPicks);
    pickTimeFilter.addEventListener("change", filterAndRenderPicks);
    refreshBtn.addEventListener("click", initMegaSabana);
}

/* DETECCIÓN CORREGIDA: MES ACTUAL COMPLETO HASTA HOY */
async function detectAvailableDates() {
    const today = new Date();
    today.setHours(23, 59, 59, 999);
    
    const start = new Date(today.getFullYear(), today.getMonth(), 1);
    const dates = [];
    let current = new Date(start);

    status.textContent = "Buscando históricos del mes actual...";
    const candidates = [];

    while (current <= today) {
        candidates.push(formatDate(current));
        current.setDate(current.getDate() + 1);
    }

    const batchSize = 10;
    for (let i = 0; i < candidates.length; i += batchSize) {
        const batch = candidates.slice(i, i + batchSize);
        const results = await Promise.all(batch.map(date => checkDate(date)));
        results.forEach(res => { if (res) dates.push(res); });
    }

    availableDates = dates.sort();

    if (!availableDates.length) {
        status.textContent = "No se encontraron históricos para este mes.";
        return;
    }
    
    status.textContent = `${availableDates.length} días detectados este mes.`;
}

async function checkDate(date) {
    const url = `${HISTORY_PATH}${date}/sharpie.json`;
    try {
        const response = await fetch(url, { method: "HEAD", cache: "no-store" });
        if (response.ok) return date;
    } catch (e) {
        try {
            const response = await fetch(url, { method: "GET", cache: "no-store" });
            if (response.ok) return date;
        } catch (err) {}
    }
    return null;
}

/* DESCARGA Y CONSOLIDACIÓN */
async function loadAllHistories() {
    status.textContent = `Descargando mega sábana (${availableDates.length} archivos)...`;
    masterPicksList = [];

    const fetchPromises = availableDates.map(async (dateStr) => {
        const url = `${HISTORY_PATH}${dateStr}/sharpie.json?t=${Date.now()}`;
        try {
            const res = await fetch(url);
            if (!res.ok) return [];
            const data = await res.json();
            
            let rawPicks = [];
            if (Array.isArray(data)) {
                rawPicks = data;
            } else if (data && typeof data === "object") {
                if (Array.isArray(data.picks)) rawPicks = data.picks;
                else if (Array.isArray(data.data)) rawPicks = data.data;
                else {
                    Object.values(data).forEach(val => {
                        if (Array.isArray(val)) rawPicks.push(...val);
                    });
                }
            }

            return rawPicks.map(p => {
                const gameName = p.game || p.event || p.match || p.encuentro || 
                                 (p.home_team && p.away_team ? `${p.away_team} vs ${p.home_team}` : null) || 
                                 "Sin evento";
                const pickTitle = p.pick || p.selection || p.team || p.bet || "";
                
                return {
                    ...p,
                    game: gameName,
                    pick: pickTitle,
                    _fileSource: dateStr
                };
            });
        } catch (e) {
            console.error(`Error procesando ${dateStr}:`, e);
            return [];
        }
    });

    const results = await Promise.all(fetchPromises);
    masterPicksList = results.flat();

    fileInfo.textContent = `Sábana del Mes Actual (${availableDates.length} días) · ${masterPicksList.length} picks en total`;
    status.textContent = "Mega sábana cargada con éxito.";

    filterAndRenderPicks();
}

/* MANEJO DE SELECTORES ARCHIVO */
function initializeSelectors() {
    const years = [...new Set(availableDates.map(d => d.substring(0, 4)))];
    yearSelect.innerHTML = '<option value="ALL">Todos los Años</option>';
    years.forEach(y => {
        const opt = document.createElement("option");
        opt.value = y; opt.textContent = y;
        yearSelect.appendChild(opt);
    });
    updateMonths();
}

function updateMonths() {
    const year = yearSelect.value;
    monthSelect.innerHTML = '<option value="ALL">Todos los Meses</option>';
    
    let filtered = availableDates;
    if (year !== "ALL") filtered = filtered.filter(d => d.startsWith(year));

    const months = [...new Set(filtered.map(d => d.substring(5, 7)))];
    months.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m; opt.textContent = monthName(m);
        monthSelect.appendChild(opt);
    });
    updateDays();
}

function updateDays() {
    const year = yearSelect.value;
    const month = monthSelect.value;
    daySelect.innerHTML = '<option value="ALL">Todos los Días</option>';

    let filtered = availableDates;
    if (year !== "ALL") filtered = filtered.filter(d => d.startsWith(year));
    if (month !== "ALL") filtered = filtered.filter(d => d.substring(5, 7) === month);

    const days = [...new Set(filtered.map(d => d.substring(8, 10)))];
    days.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = Number(d);
        daySelect.appendChild(opt);
    });
}

/* FILTRADO MULTIVARIABLE GENERAL */
function filterAndRenderPicks() {
    const selYear = yearSelect.value;
    const selMonth = monthSelect.value;
    const selDay = daySelect.value;
    const query = searchInput.value.toLowerCase().trim();
    const filterPickDate = pickDateFilter.value;
    const filterPickTime = pickTimeFilter.value;

    const filtered = masterPicksList.filter(p => {
        const fileYear = p._fileSource.substring(0, 4);
        const fileMonth = p._fileSource.substring(5, 7);
        const fileDay = p._fileSource.substring(8, 10);

        if (selYear !== "ALL" && fileYear !== selYear) return false;
        if (selMonth !== "ALL" && fileMonth !== selMonth) return false;
        if (selDay !== "ALL" && fileDay !== selDay) return false;

        const rawDateTime = p.date || p.fecha || p.commence_time || p.time || p.timestamp || p._fileSource;
        const { dateStr, timeStr } = parsePickDateTime(rawDateTime, p.time || p.hora, p._fileSource);

        if (filterPickDate && dateStr !== filterPickDate) return false;
        if (filterPickTime && !timeStr.startsWith(filterPickTime)) return false;

        if (query) {
            const fullObjectString = JSON.stringify(p).toLowerCase();
            if (!fullObjectString.includes(query)) return false;
        }

        return true;
    });

    pickCounter.textContent = `${filtered.length} de ${masterPicksList.length} picks`;

    if (!filtered.length) {
        tableBody.innerHTML = `<tr><td colspan="10" class="empty">No hay registros que coincidan con la búsqueda.</td></tr>`;
        return;
    }

    tableBody.innerHTML = filtered.map(pick => renderTableRow(pick)).join("");
}

function renderTableRow(pick) {
    const stake = pick.stake ?? "N/D";
    const odds = pick.odds ?? "N/D";
    const game = pick.game || "Sin evento";
    const pickName = pick.pick ? `${pick.pick} ${pick.market ? `(${pick.market})` : ''}` : "Sin pick";
    
    const rawDateTime = pick.date || pick.fecha || pick.commence_time || pick.time || pick.timestamp || pick._fileSource;
    const { dateStr, timeStr } = parsePickDateTime(rawDateTime, pick.time || pick.hora, pick._fileSource);

    const edgeVal = pick.modelEdge;
    const evVal = pick.ev;
    
    const winProbVal = (pick.monteCarlo && pick.monteCarlo.win_probability != null) 
        ? pick.monteCarlo.win_probability 
        : pick.modelProb;

    return `
        <tr>
            <td><span class="badge">${escapeHtml(pick._fileSource)}</span></td>
            <td>${escapeHtml(dateStr)}</td>
            <td>${escapeHtml(timeStr)}</td>
            <td><strong>${escapeHtml(game)}</strong></td>
            <td><span class="badge">${escapeHtml(pickName)}</span></td>
            <td>${escapeHtml(formatValue(odds))}</td>
            <td>${escapeHtml(formatValue(stake))}</td>
            <td class="${getValueClass(edgeVal)}">${percent(edgeVal)}</td>
            <td class="${getValueClass(evVal)}">${percent(evVal)}</td>
            <td>${percent(winProbVal)}</td>
        </tr>
    `;
}

/* PARSER DE FECHA Y HORA ULTRA-ROBUSTO */
function parsePickDateTime(dateTimeVal, explicitTime, fallbackDate) {
    let dateStr = fallbackDate || "N/D";
    let timeStr = explicitTime || "N/D";

    if (!dateTimeVal) return { dateStr, timeStr };

    const strVal = String(dateTimeVal).trim();

    // 1. Caso ISO UTC (ej. 2026-08-26T03:45:00Z)
    if (strVal.includes("T") || strVal.includes("Z")) {
        const d = new Date(strVal);
        if (!isNaN(d.getTime())) {
            dateStr = d.toLocaleDateString("en-CA"); // YYYY-MM-DD local
            if (timeStr === "N/D") {
                timeStr = d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", hour12: false });
            }
            return { dateStr, timeStr };
        }
    }

    // 2. Caso Texto "M/D, HH:MM" (ej. "8/26, 03:45")
    if (strVal.includes(",")) {
        const parts = strVal.split(",");
        const datePart = parts[0].trim();
        const timePart = parts[1] ? parts[1].trim() : "";

        if (timeStr === "N/D" && timePart) {
            timeStr = timePart.substring(0, 5);
        }

        if (datePart.includes("/")) {
            const [m, d] = datePart.split("/");
            const currentYear = fallbackDate ? fallbackDate.substring(0, 4) : new Date().getFullYear();
            dateStr = `${currentYear}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
        }
        return { dateStr, timeStr };
    }

    // 3. Caso "YYYY-MM-DD HH:MM:SS"
    if (strVal.includes(" ") && strVal.includes("-")) {
        const parts = strVal.split(" ");
        dateStr = parts[0];
        if (timeStr === "N/D" && parts[1]) {
            timeStr = parts[1].substring(0, 5);
        }
        return { dateStr, timeStr };
    }

    // 4. Caso sólo fecha "YYYY-MM-DD"
    if (strVal.includes("-") && strVal.length >= 10) {
        dateStr = strVal.substring(0, 10);
    }

    return { dateStr, timeStr };
}

/* HELPERS */
function getValueClass(val) {
    if (val == null || val === "") return "";
    const num = Number(val);
    if (num > 0) return "val-positive";
    if (num < 0) return "val-negative";
    return "";
}

function percent(value) {
    if (value === null || value === undefined || value === "") return "N/D";
    return `${Number(value).toFixed(2)}%`;
}

function formatValue(value) {
    if (value === null || value === undefined) return "N/D";
    if (typeof value === "number") return Number.isInteger(value) ? String(value) : value.toFixed(2);
    return String(value);
}

function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function monthName(month) {
    const names = {
        "01": "Enero", "02": "Febrero", "03": "Marzo", "04": "Abril",
        "05": "Mayo", "06": "Junio", "07": "Julio", "08": "Agosto",
        "09": "Septiembre", "10": "Octubre", "11": "Noviembre", "12": "Diciembre"
    };
    return names[month] || month;
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
