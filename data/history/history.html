<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Historial de Datos - Sharpie</title>


    <style>

        /* =====================================================
           VARIABLES
        ===================================================== */

        :root {

            --bg-color: #0f172a;

            --card-bg: #1e293b;

            --border-color: #334155;

            --text-main: #f8fafc;

            --text-muted: #94a3b8;

            --accent-color: #38bdf8;

            --green: #22c55e;

            --red: #ef4444;

        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background-color:
                var(--bg-color);

            color:
                var(--text-main);

            margin:
                0;

            padding:
                20px;

        }


        /* =====================================================
           CONTENEDOR
        ===================================================== */

        .container {

            width:
                100%;

            max-width:
                1400px;

            margin:
                0 auto;

        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap:
                20px;

            border-bottom:
                1px solid var(--border-color);

            padding-bottom:
                15px;

            margin-bottom:
                20px;

        }


        h1 {

            margin:
                0;

            font-size:
                1.5rem;

            color:
                var(--accent-color);

        }


        /* =====================================================
           CONTROLES
        ===================================================== */

        .controls {

            display:
                flex;

            align-items:
                center;

            gap:
                10px;

        }


        input[type="date"] {

            background-color:
                var(--card-bg);

            border:
                1px solid var(--border-color);

            color:
                var(--text-main);

            padding:
                8px 12px;

            border-radius:
                6px;

            outline:
                none;

            cursor:
                pointer;

            color-scheme:
                dark;

        }


        button {

            background-color:
                #0284c7;

            border:
                none;

            color:
                white;

            padding:
                9px 15px;

            border-radius:
                6px;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        button:hover {

            background-color:
                #0369a1;

        }


        button:disabled {

            opacity:
                0.6;

            cursor:
                not-allowed;

        }


        /* =====================================================
           BARRA DE ESTADO
        ===================================================== */

        .status-bar {

            background:
                var(--card-bg);

            padding:
                10px 15px;

            border-radius:
                6px;

            margin-bottom:
                20px;

            font-size:
                0.9rem;

            color:
                var(--text-muted);

            border-left:
                4px solid var(--accent-color);

            overflow-wrap:
                anywhere;

        }


        .status-bar code {

            color:
                var(--accent-color);

        }


        /* =====================================================
           TABLA
        ===================================================== */

        .table-wrapper {

            width:
                100%;

            overflow-x:
                auto;

            background-color:
                var(--card-bg);

            border:
                1px solid var(--border-color);

            border-radius:
                8px;

        }


        .data-table {

            width:
                100%;

            min-width:
                max-content;

            border-collapse:
                collapse;

            font-size:
                0.85rem;

        }


        .data-table th {

            background-color:
                #0f172a;

            color:
                var(--accent-color);

            text-align:
                left;

            padding:
                12px;

            border-bottom:
                2px solid var(--border-color);

            white-space:
                nowrap;

            position:
                sticky;

            top:
                0;

            z-index:
                2;

        }


        .data-table td {

            padding:
                10px 12px;

            border-bottom:
                1px solid var(--border-color);

            color:
                var(--text-main);

            white-space:
                nowrap;

            vertical-align:
                middle;

        }


        .data-table tbody tr:hover {

            background-color:
                rgba(
                    56,
                    189,
                    248,
                    0.08
                );

        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status-win {

            color:
                var(--green) !important;

            font-weight:
                bold;

        }


        .status-loss {

            color:
                var(--red) !important;

            font-weight:
                bold;

        }


        /* =====================================================
           OBJETOS JSON INTERNOS
        ===================================================== */

        .json-value {

            color:
                var(--accent-color);

            font-family:
                monospace;

            font-size:
                0.8rem;

        }


        /* =====================================================
           MENSAJES
        ===================================================== */

        .message-card {

            background-color:
                var(--card-bg);

            border:
                1px solid var(--border-color);

            border-radius:
                8px;

            padding:
                30px;

            text-align:
                center;

        }


        .message-error {

            color:
                var(--red);

        }


        .message-muted {

            color:
                var(--text-muted);

            font-size:
                0.85rem;

        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (
            max-width: 700px
        ) {

            body {

                padding:
                    10px;

            }


            header {

                flex-direction:
                    column;

                align-items:
                    stretch;

            }


            .controls {

                width:
                    100%;

            }


            input[type="date"] {

                flex:
                    1;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         ENCABEZADO
    ====================================================== -->

    <header>

        <h1>
            📜 Historial de Registros Sharpie
        </h1>


        <div class="controls">

            <input
                type="date"
                id="datePicker"
            >


            <button
                type="button"
                id="loadButton"
            >
                Cargar Fecha
            </button>

        </div>

    </header>


    <!-- =====================================================
         ESTADO
    ====================================================== -->

    <div
        class="status-bar"
        id="status"
    >

        Esperando carga...

    </div>


    <!-- =====================================================
         RUTA ACTUAL
    ====================================================== -->

    <div
        class="status-bar"
        id="pathBar"
        style="
            border-left-color:
            #64748b;
        "
    >

        Archivo:

        <code id="currentPath">
            —
        </code>

    </div>


    <!-- =====================================================
         CONTENIDO
    ====================================================== -->

    <div id="contentArea">

        <div class="message-card">

            Cargando datos...

        </div>

    </div>


</div>


<script>


/* ============================================================
   CONFIGURACIÓN

   IMPORTANTE:

   Este HTML está dentro de:

   data/history/

   Las carpetas están al mismo nivel:

   data/history/2026-07-24/
   data/history/2026-07-23/

   Por eso la ruta es:

   ./2026-07-24/sharpie.json

============================================================ */


const FILE_NAME =
    'sharpie.json';



/* ============================================================
   OBTENER FECHA ACTUAL

   Devuelve:

   2026-07-24

============================================================ */


function obtenerFechaActual() {

    const hoy =
        new Date();


    const year =
        hoy.getFullYear();


    const month =
        String(
            hoy.getMonth() + 1
        ).padStart(
            2,
            '0'
        );


    const day =
        String(
            hoy.getDate()
        ).padStart(
            2,
            '0'
        );


    return (

        year +
        '-' +
        month +
        '-' +
        day

    );

}



/* ============================================================
   CONSTRUIR RUTA DEL ARCHIVO

   Ejemplo:

   Fecha:
   2026-07-24

   Resultado:

   ./2026-07-24/sharpie.json

============================================================ */


function construirRuta(
    fecha
) {

    return (

        './' +
        fecha +
        '/' +
        FILE_NAME

    );

}



/* ============================================================
   CARGAR JSON

   Esta función se ejecuta:

   1. Al abrir la página.
   2. Al pulsar "Cargar Fecha".

============================================================ */


async function cargarJSON() {


    console.log(
        '===================================='
    );


    console.log(
        '🚀 INICIANDO CARGA'
    );


    /* ========================================================
       OBTENER ELEMENTOS
    ======================================================== */


    const datePicker =
        document.getElementById(
            'datePicker'
        );


    const status =
        document.getElementById(
            'status'
        );


    const currentPath =
        document.getElementById(
            'currentPath'
        );


    const contentArea =
        document.getElementById(
            'contentArea'
        );


    const loadButton =
        document.getElementById(
            'loadButton'
        );


    /* ========================================================
       OBTENER FECHA SELECCIONADA

       IMPORTANTE:

       Siempre toma el valor actual
       del datepicker.

    ======================================================== */


    const fecha =
        datePicker.value;


    console.log(
        '📅 Fecha seleccionada:',
        fecha
    );


    /* ========================================================
       VALIDAR FECHA
    ======================================================== */


    if (!fecha) {

        console.error(
            '❌ No hay fecha seleccionada'
        );


        status.innerHTML =
            '❌ Selecciona una fecha.';


        return;

    }


    /* ========================================================
       CONSTRUIR RUTA
    ======================================================== */


    const fileUrl =
        construirRuta(
            fecha
        );


    console.log(
        '📂 Ruta:',
        fileUrl
    );


    /* ========================================================
       MOSTRAR RUTA
    ======================================================== */


    currentPath.textContent =
        fileUrl;


    /* ========================================================
       ESTADO DE CARGA
    ======================================================== */


    status.style.borderLeftColor =
        '#38bdf8';


    status.innerHTML =
        '⏳ Cargando datos de <strong>' +
        fecha +
        '</strong>...';


    /* ========================================================
       DESACTIVAR BOTÓN
    ======================================================== */


    loadButton.disabled =
        true;


    loadButton.textContent =
        'Cargando...';


    try {


        /* ====================================================
           FETCH

           EJEMPLO:

           ./2026-07-24/sharpie.json

        ==================================================== */


        console.log(
            '🌐 Ejecutando fetch:',
            fileUrl
        );


        const response =
            await fetch(
                fileUrl +
                '?t=' +
                Date.now()
            );


        /* ====================================================
           RESPUESTA HTTP
        ==================================================== */


        console.log(
            '📡 HTTP:',
            response.status
        );


        /* ====================================================
           VALIDAR RESPUESTA
        ==================================================== */


        if (!response.ok) {

            throw new Error(

                'HTTP ' +
                response.status +
                ' - Archivo no encontrado'

            );

        }


        /* ====================================================
           CONVERTIR JSON
        ==================================================== */


        const data =
            await response.json();


        console.log(
            '✅ JSON cargado correctamente'
        );


        console.log(
            '📦 Datos:',
            data
        );


        /* ====================================================
           ESTADO ÉXITO
        ==================================================== */


        status.style.borderLeftColor =
            '#22c55e';


        status.innerHTML =

            '✅ Datos cargados correctamente para ' +

            '<strong>' +

            fecha +

            '</strong>';


        /* ====================================================
           RENDERIZAR TABLA
        ==================================================== */


        renderData(
            data
        );


    }

    catch (
        error
    ) {


        /* ====================================================
           ERROR
        ==================================================== */


        console.error(
            '❌ ERROR:',
            error
        );


        status.style.borderLeftColor =
            '#ef4444';


        status.innerHTML =

            '❌ No se pudieron cargar los datos de ' +

            '<strong>' +

            fecha +

            '</strong>';


        contentArea.innerHTML = `

            <div class="message-card">

                <p class="message-error">

                    ❌ No se pudo cargar el archivo.

                </p>


                <p class="message-muted">

                    Archivo buscado:

                </p>


                <p>

                    <code>
                        ${fileUrl}
                    </code>

                </p>


                <p class="message-muted">

                    Error:

                    ${error.message}

                </p>

            </div>

        `;

    }


    finally {


        /* ====================================================
           REACTIVAR BOTÓN
        ==================================================== */


        loadButton.disabled =
            false;


        loadButton.textContent =
            'Cargar Fecha';

    }

}



/* ============================================================
   RENDERIZAR TABLA

   Convierte el JSON recibido
   en una tabla HTML.

============================================================ */


function renderData(
    data
) {


    const contentArea =
        document.getElementById(
            'contentArea'
        );


    /* ========================================================
       LIMPIAR TABLA ANTERIOR
    ======================================================== */


    contentArea.innerHTML =
        '';


    /* ========================================================
       NORMALIZAR REGISTROS
    ======================================================== */


    let registros =
        [];


    /* ========================================================
       SI EL JSON ES UN ARRAY

       [
           {...},
           {...}
       ]

    ======================================================== */


    if (
        Array.isArray(
            data
        )
    ) {

        registros =
            data;

    }


    /* ========================================================
       SI EL JSON ES UN OBJETO
    ======================================================== */


    else if (

        typeof data ===
        'object' &&

        data !== null

    ) {


        /* ====================================================
           BUSCAR UN ARRAY DENTRO DEL OBJETO

           Ejemplo:

           {
               "picks": [
                   {...},
                   {...}
               ]
           }

        ==================================================== */


        const arraysEncontrados =

            Object.values(
                data
            ).filter(

                valor =>
                    Array.isArray(
                        valor
                    )

            );


        if (
            arraysEncontrados.length > 0
        ) {

            registros =
                arraysEncontrados[0];

        }

        else {

            registros =
                [data];

        }

    }


    /* ========================================================
       VALIDAR DATOS
    ======================================================== */


    if (
        registros.length === 0
    ) {

        contentArea.innerHTML = `

            <div class="message-card">

                <p>
                    No hay registros
                    para mostrar.
                </p>

            </div>

        `;


        return;

    }


    /* ========================================================
       OBTENER TODAS LAS COLUMNAS
    ======================================================== */


    const columnas = [

        ...new Set(

            registros.flatMap(

                registro =>

                    (

                        typeof registro ===
                        'object' &&

                        registro !== null

                    )

                    ?

                    Object.keys(
                        registro
                    )

                    :

                    []

            )

        )

    ];


    /* ========================================================
       CREAR WRAPPER
    ======================================================== */


    const wrapper =
        document.createElement(
            'div'
        );


    wrapper.className =
        'table-wrapper';


    /* ========================================================
       CREAR TABLA
    ======================================================== */


    const table =
        document.createElement(
            'table'
        );


    table.className =
        'data-table';


    /* ========================================================
       CREAR CABECERA
    ======================================================== */


    const thead =
        document.createElement(
            'thead'
        );


    const headerRow =
        document.createElement(
            'tr'
        );


    columnas.forEach(

        columna => {


            const th =
                document.createElement(
                    'th'
                );


            th.textContent =
                columna;


            headerRow.appendChild(
                th
            );

        }

    );


    thead.appendChild(
        headerRow
    );


    /* ========================================================
       CREAR CUERPO
    ======================================================== */


    const tbody =
        document.createElement(
            'tbody'
        );


    registros.forEach(

        registro => {


            const tr =
                document.createElement(
                    'tr'
                );


            columnas.forEach(

                columna => {


                    const td =
                        document.createElement(
                            'td'
                        );


                    let valor =

                        registro &&
                        typeof registro ===
                        'object'

                        ?

                        registro[
                            columna
                        ]

                        :

                        '';


                    /* ========================================
                       VALORES VACÍOS
                    ======================================== */


                    if (

                        valor ===
                        undefined ||

                        valor ===
                        null ||

                        valor ===
                        ''

                    ) {

                        valor =
                            '—';

                    }


                    /* ========================================
                       OBJETOS / ARRAYS
                    ======================================== */


                    if (

                        typeof valor ===
                        'object' &&

                        valor !== null

                    ) {


                        valor =

                            JSON.stringify(
                                valor
                            );


                        td.classList.add(
                            'json-value'
                        );

                    }


                    /* ========================================
                       INSERTAR VALOR
                    ======================================== */


                    td.textContent =
                        valor;


                    /* ========================================
                       STATUS WIN
                    ======================================== */


                    if (

                        columna.toLowerCase() ===
                        'status'

                    ) {


                        const estado =

                            String(
                                valor
                            ).toUpperCase();


                        if (

                            estado ===
                            'WIN' ||

                            estado ===
                            'WON'

                        ) {

                            td.classList.add(
                                'status-win'
                            );

                        }


                        if (

                            estado ===
                            'LOSS' ||

                            estado ===
                            'LOST'

                        ) {

                            td.classList.add(
                                'status-loss'
                            );

                        }

                    }


                    /* ========================================
                       AGREGAR CELDA
                    ======================================== */


                    tr.appendChild(
                        td
                    );

                }

            );


            /* ================================================
               AGREGAR FILA
            ================================================= */


            tbody.appendChild(
                tr
            );

        }

    );


    /* ========================================================
       ARMAR TABLA
    ======================================================== */


    table.appendChild(
        thead
    );


    table.appendChild(
        tbody
    );


    wrapper.appendChild(
        table
    );


    contentArea.appendChild(
        wrapper
    );

}



/* ============================================================
   INICIALIZACIÓN

   ESTE ES EL ÚNICO DOMContentLoaded
   DE TODO EL ARCHIVO.

============================================================ */


document.addEventListener(
    'DOMContentLoaded',
    function () {


        console.log(
            '✅ Sharpie History iniciado'
        );


        /* ====================================================
           OBTENER ELEMENTOS
        ==================================================== */


        const datePicker =
            document.getElementById(
                'datePicker'
            );


        const loadButton =
            document.getElementById(
                'loadButton'
            );


        /* ====================================================
           ASIGNAR FECHA ACTUAL
        ==================================================== */


        datePicker.value =
            obtenerFechaActual();


        console.log(

            '📅 Fecha inicial:',

            datePicker.value

        );


        /* ====================================================
           EVENTO DEL BOTÓN

           IMPORTANTE:

           Este evento se registra UNA SOLA VEZ.

        ==================================================== */


        loadButton.addEventListener(
            'click',
            function () {


                console.log(
                    '🖱️ BOTÓN PRESIONADO'
                );


                console.log(

                    '📅 Fecha seleccionada:',

                    datePicker.value

                );


                cargarJSON();

            }
        );


        /* ====================================================
           CARGAR FECHA ACTUAL AUTOMÁTICAMENTE
        ==================================================== */


        cargarJSON();

    }
);


</script>


</body>

</html>
