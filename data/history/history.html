<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sharpie Data Viewer</title>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0b0f14;
            --panel: #111820;
            --panel2: #151e28;
            --border: #26313d;
            --text: #e8edf2;
            --muted: #8e9aa7;
            --accent: #4da3ff;
            --green: #35c98a;
            --red: #ef6262;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        header {
            min-height: 70px;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0e141b;
            border-bottom: 1px solid var(--border);
        }

        header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
        header p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

        .container {
            width: min(1600px, calc(100% - 40px));
            margin: 20px auto;
        }

        /* FILTERS & SEARCH */
        .filters {
            display: flex;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .filter {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter.grow {
            flex-grow: 1;
            min-width: 200px;
        }

        .filter label {
            color: var(--muted);
            font-size: 12px;
        }

        select, input {
            padding: 9px 12px;
            background: #0d1319;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            font-size: 13px;
        }

        select { cursor: pointer; min-width: 110px; }

        input:focus { border-color: var(--accent); }

        button {
            border: 1px solid var(--border);
            background: var(--panel2);
            color: var(--text);
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        button:hover { background: #1b2632; }
        button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

        #status {
            margin-bottom: 15px;
            color: var(--muted);
            font-size: 13px;
        }

        /* SECTION HEADER */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-header h2 { margin: 0; font-size: 16px; }
        .section-header span { color: var(--muted); font-size: 13px; }

        /* TABLE VIEW */
        .table-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 70vh;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            background: #0e141b;
            position: sticky;
            top: 0;
            z-index: 2;
            font-weight: 600;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            background: var(--panel2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .val-positive { color: var(--green); }
        .val-negative { color: var(--red); }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
        }

        .error { color: var(--red) !important; }

        @media (max-width: 700px) {
            header { padding: 15px; flex-direction: column; align-items: flex-start; gap: 10px; }
            .container { width: calc(100% - 20px); }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>SHARPIE DATA VIEWER</h1>
        <p id="fileInfo">Detectando históricos...</p>
    </div>
    <button id="refreshBtn">↻ Actualizar</button>
</header>

<main class="container">

    <!-- FILTROS & BUSCADOR -->
    <section class="filters">
        <div class="filter">
            <label>Año</label>
            <select id="yearSelect"></select>
        </div>

        <div class="filter">
            <label>Mes</label>
            <select id="monthSelect"></select>
        </div>

        <div class="filter">
            <label>Día</label>
            <select id="daySelect"></select>
        </div>

        <button id="loadBtn" class="primary">Cargar Día</button>

        <!-- FILTRO DE BÚSQUEDA POR EQUIPO/EVENTO -->
        <div class="filter grow">
            <label>Buscar Encuentro / Equipo</label>
            <input type="text" id="searchInput" placeholder="Ej. Lakers, Real Madrid, Over...">
        </div>
    </section>

    <div id="status">Detectando fechas disponibles...</div>

    <!-- MAIN TABLE -->
    <section>
        <div class="section-header">
            <h2>Registros del día</h2>
            <span id="pickCounter">0 picks</span>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Evento</th>
                            <th>Pick</th>
                            <th>Cuota</th>
                            <th>Stake</th>
                            <th>Edge</th>
                            <th>EV</th>
                            <th>Win Prob</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" class="empty">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<script>
"use strict";

const HISTORY_PATH = "./";

/* ELEMENTOS DOM */
const yearSelect = document.getElementById("yearSelect");
const monthSelect = document.getElementById("monthSelect");
const daySelect = document.getElementById("daySelect");
const loadBtn = document.getElementById("loadBtn");
const refreshBtn = document.getElementById("refreshBtn");
const searchInput = document.getElementById("searchInput");
const status = document.getElementById("status");
const fileInfo = document.getElementById("fileInfo");
const tableBody = document.getElementById("tableBody");
const pickCounter = document.getElementById("pickCounter");

let availableDates = [];
let currentPicks = []; // Caché de los picks cargados para el filtro en vivo

document.addEventListener("DOMContentLoaded", async () => {
    await detectAvailableDates();
    initializeFilters();
    selectToday();
});

/* INICIALIZACIÓN DE BÚSQUEDA */
searchInput.addEventListener("input", filterAndRenderPicks);

/* DETECCIÓN DE FECHAS */
async function detectAvailableDates() {
    const today = new Date();
    const start = new Date(2026, 0, 1);
    const dates = [];
    let current = new Date(start);

    status.textContent = "Buscando históricos...";
    const candidates = [];

    while (current <= today) {
        candidates.push(formatDate(current));
        current.setDate(current.getDate() + 1);
    }

    const batchSize = 10;
    for (let i = 0; i < candidates.length; i += batchSize) {
        const batch = candidates.slice(i, i + batchSize);
        const results = await Promise.all(batch.map(date => checkDate(date)));
        results.forEach(res => { if (res) dates.push(res); });
        status.textContent = `Buscando históricos... ${Math.min(i + batchSize, candidates.length)}/${candidates.length}`;
    }

    availableDates = dates.sort();

    if (!availableDates.length) {
        status.textContent = "No se encontraron históricos.";
        return;
    }
    status.textContent = `${availableDates.length} históricos encontrados.`;
}

async function checkDate(date) {
    const url = `${HISTORY_PATH}${date}/sharpie.json`;
    try {
        const response = await fetch(url, { method: "HEAD", cache: "no-store" });
        if (response.ok) return date;
    } catch (e) {
        try {
            const response = await fetch(url, { method: "GET", cache: "no-store" });
            if (response.ok) return date;
        } catch (err) {}
    }
    return null;
}

/* MANEJO DE FILTROS DE FECHA */
function initializeFilters() {
    const years = [...new Set(availableDates.map(d => d.substring(0, 4)))];
    yearSelect.innerHTML = "";
    years.forEach(y => {
        const opt = document.createElement("option");
        opt.value = y; opt.textContent = y;
        yearSelect.appendChild(opt);
    });

    yearSelect.addEventListener("change", updateMonths);
    monthSelect.addEventListener("change", updateDays);
    loadBtn.addEventListener("click", loadSelectedDate);
    refreshBtn.addEventListener("click", loadSelectedDate);

    updateMonths();
}

function selectToday() {
    const today = formatDate(new Date());
    let date = availableDates.includes(today) ? today : availableDates[availableDates.length - 1];
    if (!date) return;

    const parts = date.split("-");
    yearSelect.value = parts[0];
    updateMonths();
    monthSelect.value = parts[1];
    updateDays();
    daySelect.value = parts[2];

    loadDate(date);
}

function updateMonths() {
    const year = yearSelect.value;
    const months = [...new Set(availableDates.filter(d => d.startsWith(year)).map(d => d.substring(5, 7)))];
    monthSelect.innerHTML = "";
    months.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m; opt.textContent = monthName(m);
        monthSelect.appendChild(opt);
    });
    updateDays();
}

function updateDays() {
    const year = yearSelect.value;
    const month = monthSelect.value;
    const dates = availableDates.filter(d => d.startsWith(`${year}-${month}`));
    daySelect.innerHTML = "";
    dates.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.substring(8, 10);
        opt.textContent = Number(d.substring(8, 10));
        daySelect.appendChild(opt);
    });
}

function loadSelectedDate() {
    const date = `${yearSelect.value}-${monthSelect.value}-${daySelect.value}`;
    loadDate(date);
}

/* CARGA DE DATOS */
async function loadDate(date) {
    const url = `${HISTORY_PATH}${date}/sharpie.json`;
    status.textContent = `Cargando ${date}...`;
    status.classList.remove("error");

    try {
        const response = await fetch(`${url}?t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        fileInfo.textContent = `history/${date}/sharpie.json · Generado: ${data.generated_at || "N/D"}`;

        currentPicks = Array.isArray(data.picks) ? data.picks : [];
        searchInput.value = ""; // Reiniciar buscador
        filterAndRenderPicks();

        status.textContent = `Datos cargados: ${date}`;
    } catch (error) {
        console.error(error);
        status.textContent = `Error cargando ${date}`;
        status.classList.add("error");
        currentPicks = [];
        tableBody.innerHTML = `<tr><td colspan="7" class="empty">No se pudo cargar <strong>${escapeHtml(url)}</strong></td></tr>`;
        pickCounter.textContent = "0 picks";
    }
}

/* RENDERIZADO Y FILTRADO */
function filterAndRenderPicks() {
    const query = searchInput.value.toLowerCase().trim();

    // Filtra el evento, equipo o el pick
    const filtered = currentPicks.filter(p => {
        const gameMatch = (p.game || "").toLowerCase().includes(query);
        const pickMatch = (p.pick || "").toLowerCase().includes(query);
        return gameMatch || pickMatch;
    });

    pickCounter.textContent = `${filtered.length} de ${currentPicks.length} picks`;

    if (!filtered.length) {
        tableBody.innerHTML = `<tr><td colspan="7" class="empty">No hay registros que coincidan con la búsqueda.</td></tr>`;
        return;
    }

    tableBody.innerHTML = filtered.map(pick => renderTableRow(pick)).join("");
}

function renderTableRow(pick) {
    // Extracción de la versión más relevante/reciente de las variables requeridas
    const stake = pick.stake ?? "N/D";
    const odds = pick.odds ?? "N/D";
    const game = pick.game || "Sin evento";
    const pickName = pick.pick ? `${pick.pick} ${pick.market ? `(${pick.market})` : ''}` : "Sin pick";
    
    // Métricas
    const edgeVal = pick.modelEdge;
    const evVal = pick.ev;
    
    // Win Prob (Prioriza la simulación Monte Carlo si existe, luego la probabilidad del modelo)
    const winProbVal = (pick.monteCarlo && pick.monteCarlo.win_probability != null) 
        ? pick.monteCarlo.win_probability 
        : pick.modelProb;

    return `
        <tr>
            <td><strong>${escapeHtml(game)}</strong></td>
            <td><span class="badge">${escapeHtml(pickName)}</span></td>
            <td>${escapeHtml(formatValue(odds))}</td>
            <td>${escapeHtml(formatValue(stake))}</td>
            <td class="${getValueClass(edgeVal)}">${percent(edgeVal)}</td>
            <td class="${getValueClass(evVal)}">${percent(evVal)}</td>
            <td>${percent(winProbVal)}</td>
        </tr>
    `;
}

/* HELPERS DE FORMATO */
function getValueClass(val) {
    if (val == null || val === "") return "";
    const num = Number(val);
    if (num > 0) return "val-positive";
    if (num < 0) return "val-negative";
    return "";
}

function percent(value) {
    if (value === null || value === undefined || value === "") return "N/D";
    return `${Number(value).toFixed(2)}%`;
}

function formatValue(value) {
    if (value === null || value === undefined) return "N/D";
    if (typeof value === "number") return Number.isInteger(value) ? String(value) : value.toFixed(2);
    return String(value);
}

function formatDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function monthName(month) {
    const names = {
        "01": "Enero", "02": "Febrero", "03": "Marzo", "04": "Abril",
        "05": "Mayo", "06": "Junio", "07": "Julio", "08": "Agosto",
        "09": "Septiembre", "10": "Octubre", "11": "Noviembre", "12": "Diciembre"
    };
    return names[month] || month;
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
